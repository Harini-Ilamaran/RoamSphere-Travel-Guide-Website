<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
      integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./images/RoamSphere.png" />
    <title>Packages - RoamSphere</title>
    <style>
      .packages-page {
        padding: 2rem;
        padding-top: 80px;
      }

      .packages-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      .package-card {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, box-shadow 0.3s;
        aspect-ratio: 4/3;
      }

      .package-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }

      .package-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .package-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
      }

      .package-card h3 {
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        color: white;
        z-index: 1;
        font-size: 1.5rem;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
      }

      @media (max-width: 768px) {
        .packages-page {
          padding: 1rem;
          padding-top: 55px;
        }

        .packages-grid {
          grid-template-columns: 1fr;
        }
        .login {
          padding: 0.7rem 1.5rem;
          border-radius: 5px;
          background-color: white;
          color: black;
          border: none;
          cursor: pointer;
          transition: background-color 0.3s;
          font-size: 1rem;
          font-weight: 600;
          min-width: 100px;
        }

        .login:hover {
          background-color: skyblue;
        }
      }
    </style>
  </head>

  <body>
    <div class="main-content">
      <div class="navigation">
        <div class="logo-container">
          <h1 class="RoamSphere">
            <i class="fa-solid fa-route"></i><a href="./index.html"> RoamSphere</a>
          </h1>
        </div>
        <div class="menu-container">
          <button class="menu-toggle" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
          </button>
          <div class="menu-overlay"></div>
          <div class="sidebar">
            <div class="sidebar-header">
              <button class="close-btn" aria-label="Close menu">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <ul class="menu-items">
              <li class="list"><a href="./index.html">Home</a></li>
              <li class="list"><a href="./aboutus.html">About Us</a></li>
              <li class="list"><a href="./packages.html">Packages</a></li>
              <li class="list"><a href="./review.html">Reviews</a></li>
              <li class="list"><a href="./needHelpPage.html">Need help?</a></li>
              <li class="list login-item">
                <button class="login">
                  <a href="./loginpage.html" style="color: black">Login</a>
                </button>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="packages-page">
        <div class="packages-grid">
          <a href="#" class="package-card">
            <img src="./images/india.jpg" alt="India" />
            <h3>India</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/africa.jpg" alt="Africa" />
            <h3>Africa</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/america.jpg" alt="America" />
            <h3>America</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/china.jpg" alt="China" />
            <h3>China</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/france.jpg" alt="France" />
            <h3>France</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/islands.jpg" alt="Islands" />
            <h3>Islands</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/australia.jpg" alt="Australia" />
            <h3>Australia</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/thailand.jpg" alt="Thailand" />
            <h3>Thailand</h3>
          </a>
          <a href="#" class="package-card">
            <img src="./images/japan.jpg" alt="Japan" />
            <h3>Japan</h3>
          </a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>

</html>
